name: Build Desktop App

# Windows installer + portable EXE, Linux AppImage. The desktop shell wraps the
# exact same web/ folder that Capacitor copies into the Android APK.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            target: dist:win
            pattern: desktop/release/*.exe
          - os: ubuntu-latest
            label: Linux
            target: dist:linux
            pattern: desktop/release/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verify three A4 pages per answer
        run: npm run check:pages

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Package the desktop app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.label }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 90

  # =======================================================================
  # A tag push turns the installers into GitHub Release assets, next to the
  # APK published by the Android workflow.
  # =======================================================================
  release:
    name: Attach installers to the release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the installers
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          REPO="${GITHUB_REPOSITORY}"

          # The Android workflow publishes to the same tag. The release may
          # already exist, may be created at the same moment, or not exist yet.
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              break
            fi
            gh release create "$TAG" --repo "$REPO" \
              --title "BCA Sem V — $TAG" \
              --notes "BCA Semester V assignment suite — Android APK and desktop installers." || true
            sleep 4
          done

          gh release upload "$TAG" dist/* --repo "$REPO" --clobber

          gh release view "$TAG" --repo "$REPO" --json url,assets \
            --jq '"release: \(.url)  assets: \([.assets[].name] | join(", "))"'
