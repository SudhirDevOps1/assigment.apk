name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # NB: the secrets context is not available inside `steps.*.if`, so the
    # signing material is exposed as job level env and checked with `env`.
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------------------------------------------------------- deps
      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      # ------------------------------------------------- generate the project
      # The android/ folder is NOT committed - CI creates it on every build, so
      # the repository stays tiny and can never drift out of date.
      - name: Create the Android project
        run: npx cap add android

      - name: Copy the web app into the APK
        run: npx cap sync android

      # ------------------------------------------------------ native tweaks
      - name: Enable zoom and rotation
        run: node scripts/patch-android.mjs

      # --------------------------------------------------------- keystore
      # Runs only when the signing secrets exist. Without them the workflow
      # still produces an installable debug APK, so the first build never fails.
      - name: Write the release keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          echo "keystore.properties written"

      # ------------------------------------------------------------- build
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # --------------------------------------------------------- artifacts
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bca-sem-v-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload release APK
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: bca-sem-v-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      # ------------------------------------------------------------ summary
      - name: Summary
        run: |
          {
            echo "## APK ready"
            echo ""
            echo "| build | size |"
            echo "|---|---|"
            for f in android/app/build/outputs/apk/*/*.apk; do
              [ -e "$f" ] || continue
              printf '| %s | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo ""
            echo "Open **Actions -> Artifacts** of this run to download it."
          } >> "$GITHUB_STEP_SUMMARY"